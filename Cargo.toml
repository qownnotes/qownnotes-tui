[package]
name = "qownnotes-tui"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first terminal browser for QOwnNotes-compatible note folders"
license = "GPL-3.0-only"
repository = "https://github.com/qownnotes/qownnotes-tui"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = { version = "0.29", features = ["osc52"] }
directories = "6.0"
ignore = "0.4"
percent-encoding = "2.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0", features = ["derive"] }
shell-words = "1.1"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5.2"
unicode-segmentation = "1.12"
ureq = { version = "3.4", features = ["charset"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
