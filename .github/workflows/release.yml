name: Release

on:
  push:
    branches:
      - release

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-info:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="v$version"
          existing_commit="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag already points to a different commit" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: release-info
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            executable: qownnotes-tui
            archive: qownnotes-tui-linux-x86_64.tar.gz
          - os: macos-latest
            platform: macos
            executable: qownnotes-tui
            archive: qownnotes-tui-macos.tar.gz
          - os: windows-latest
            platform: windows-x86_64
            executable: qownnotes-tui.exe
            archive: qownnotes-tui-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --release
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp "target/release/${{ matrix.executable }}" README.md LICENSE package/
          tar -C package -czf "${{ matrix.archive }}" "${{ matrix.executable }}" README.md LICENSE
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item "target/release/${{ matrix.executable }}", README.md, LICENSE -Destination package
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [release-info, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum qownnotes-tui-* > SHA256SUMS
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        shell: bash
        run: |
          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
